name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package
        run: npm run pack

      - name: Check tag against package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          awk -v plain="$tag" -v prefixed="v$tag" '
            function heading(s,   rest) {
              if (substr(s, 1, 3) != "## ") return ""
              rest = substr(s, 4)
              gsub(/^[ \t]+/, "", rest)
              gsub(/[ \t]+$/, "", rest)
              gsub(/^\[/, "", rest)
              gsub(/\]$/, "", rest)
              return rest
            }
            {
              if (inside) {
                if (heading($0) != "") exit
                print
                next
              }
              if (heading($0) == plain || heading($0) == prefixed) inside = 1
            }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${tag}"
            exit 1
          fi
          echo "----- notes.md -----"
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="$(ls dist/*.zip)"
          echo "asset: ${asset}"

          case "${GITHUB_REF_NAME}" in
            *-*) pre="--prerelease" ;;
            *)   pre="" ;;
          esac

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md $pre
            gh release view "${GITHUB_REF_NAME}" \
              --json assets \
              --jq '.assets[] | select(.name | endswith(".zip")) | .name' \
              | while read -r old; do
                  echo "removing stale asset: ${old}"
                  gh release delete-asset "${GITHUB_REF_NAME}" "$old" -y
                done
            gh release upload "${GITHUB_REF_NAME}" $asset --clobber
          else
            gh release create "${GITHUB_REF_NAME}" $asset \
              --title "DoL-Hotkeys-${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              $pre
          fi
